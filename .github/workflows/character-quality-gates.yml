      - "scripts/gahyeon_quality_test_fixture.py"
      - "scripts/package_gahyeon_g1_handoff.py"
      - "scripts/test_package_gahyeon_g1_handoff.py"
      - "scripts/verify_gahyeon_g1_authoring_work_order.py"
      - "scripts/test_verify_gahyeon_g1_authoring_work_order.py"
      - "scripts/verify_gahyeon_g1_handoff.py"
      - "scripts/create_gahyeon_quality_review.py"
      - "scripts/test_create_gahyeon_quality_review.py"
      - "scripts/report_gahyeon_character_pipeline.py"
      - "scripts/test_report_gahyeon_character_pipeline.py"
      - "scripts/verify_gahyeon_sdxl_artifacts.py"
      - "scripts/test_verify_gahyeon_sdxl_artifacts.py"
      - "scripts/record_gahyeon_quality_evidence.py"
      - "scripts/test_record_gahyeon_quality_evidence.py"
      - "scripts/record_gahyeon_quality_artifact.py"
      - "scripts/test_record_gahyeon_quality_artifact.py"
      - "scripts/record_gahyeon_quality_approval.py"
      - "scripts/record_gahyeon_quality_finding.py"
      - "scripts/test_record_gahyeon_quality_finding.py"
      - "scripts/transition_gahyeon_quality_review.py"
      - "scripts/test_gahyeon_quality_review_lifecycle.py"
      - "scripts/verify_gahyeon_*review.py"
      - "scripts/verify_gahyeon_hero_asset.py"
      - "scripts/verify_gahyeon_identity_reference.py"
      - "scripts/verify_gahyeon_modeling_input.py"
      - "scripts/verify_gahyeon_quality_contracts.py"
      - "scripts/test_verify_gahyeon_*.py"
      - "scripts/requirements-contracts.txt"
      - ".github/workflows/character-quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-contracts.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-contracts.txt
      - name: Verify schema and verifier consistency
        run: |
          python3 scripts/test_verify_gahyeon_quality_contracts.py
          python3 scripts/verify_gahyeon_quality_contracts.py
          python3 scripts/test_create_gahyeon_quality_review.py
          python3 scripts/test_report_gahyeon_character_pipeline.py
          python3 scripts/test_record_gahyeon_quality_evidence.py
          python3 scripts/test_record_gahyeon_quality_artifact.py
          python3 scripts/test_record_gahyeon_quality_finding.py
          python3 scripts/test_gahyeon_quality_review_lifecycle.py
          python3 scripts/test_verify_gahyeon_sdxl_artifacts.py
          python3 scripts/verify_gahyeon_sdxl_artifacts.py
      - name: Verify identity through G5 Hero chain
        run: |
          python3 scripts/test_verify_gahyeon_identity_reference.py
          python3 scripts/test_verify_gahyeon_modeling_input.py
          python3 scripts/test_verify_gahyeon_g1_authoring_work_order.py
          python3 scripts/test_package_gahyeon_g1_handoff.py
          python3 scripts/test_verify_gahyeon_g1_review.py
          python3 scripts/test_verify_gahyeon_hero_asset.py
      - name: Compile all quality verifiers
        run: python3 -m py_compile scripts/create_gahyeon_quality_review.py scripts/package_gahyeon_g1_handoff.py scripts/record_gahyeon_quality_artifact.py scripts/record_gahyeon_quality_evidence.py scripts/record_gahyeon_quality_approval.py scripts/record_gahyeon_quality_finding.py scripts/transition_gahyeon_quality_review.py scripts/report_gahyeon_character_pipeline.py scripts/verify_gahyeon_sdxl_artifacts.py scripts/verify_gahyeon_g1_authoring_work_order.py scripts/verify_gahyeon_g1_handoff.py scripts/verify_gahyeon_g{1,2,3,4,5}_review.py scripts/verify_gahyeon_hero_asset.py
