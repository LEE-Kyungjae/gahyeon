      - "scripts/record_gahyeon_quality_evidence.py"
      - "scripts/test_record_gahyeon_quality_evidence.py"
      - "scripts/record_gahyeon_quality_artifact.py"
      - "scripts/test_record_gahyeon_quality_artifact.py"
      - "scripts/record_gahyeon_quality_approval.py"
      - "scripts/record_gahyeon_quality_finding.py"
