name: Verify Production

on:
  workflow_dispatch:
    inputs:
      expected_image_tag:
        description: Expected gahyeonbot image tag (for example sha-caff3e2)
        required: false
        type: string
  workflow_run:
    workflows:
      - Build Image
    types:
      - completed

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify rollout and runtime
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.expected_image_tag }}
          DEPLOYED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          expected_image_tag="$REQUESTED_IMAGE_TAG"
          if [ -z "$expected_image_tag" ] && [ -n "$DEPLOYED_HEAD_SHA" ]; then
            expected_image_tag="sha-${DEPLOYED_HEAD_SHA:0:7}"
          fi
          ssh -p "${SSH_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" \
            "EXPECTED_IMAGE_TAG='$expected_image_tag' bash -s" <<'REMOTE'
          set -euo pipefail

          namespace=gahyeonbot
          deployment=gahyeonbot
          # Only the Core container receives the release image. Sidecars such as
          # edge-tts stay pinned on purpose (see quality/ai-regressions.json), so
          # requiring every container to match the release tag never converges.
          core_container=gahyeonbot

          if [ -n "$EXPECTED_IMAGE_TAG" ]; then
            for attempt in $(seq 1 60); do
              images="$(kubectl -n "$namespace" get deployment "$deployment" \
                -o jsonpath='{range .spec.template.spec.containers[*]}{.name}={.image}{"\n"}{end}')"
              core_image="$(printf '%s\n' "$images" | sed -n "s/^${core_container}=//p")"
              if [ -z "$core_image" ]; then
                printf 'Container %s not found in deployment %s. Current images:\n%s\n' \
                  "$core_container" "$deployment" "$images" >&2
                exit 1
              fi
              if [ "${core_image##*:}" = "$EXPECTED_IMAGE_TAG" ]; then
                break
              fi
              printf 'Waiting for %s (%s/60). Current images:\n%s\n' \
                "$EXPECTED_IMAGE_TAG" "$attempt" "$images"
              if [ "$attempt" -eq 60 ]; then
                printf 'Timed out waiting for %s. Current images:\n%s\n' \
                  "$EXPECTED_IMAGE_TAG" "$images" >&2
                exit 1
              fi
              sleep 10
            done
          fi

          kubectl -n "$namespace" rollout status "deployment/$deployment" --timeout=10m

          images="$(kubectl -n "$namespace" get deployment "$deployment" \
            -o jsonpath='{range .spec.template.spec.containers[*]}{.name}={.image}{"\n"}{end}')"
          printf '%s\n' "$images"

          kubectl -n "$namespace" get pods -l app=gahyeonbot -o wide
          kubectl -n "$namespace" get ingress gahyeonbot -o wide
          kubectl -n "$namespace" get deployment "$deployment" \
            -o jsonpath='{.status.readyReplicas}/{.status.replicas}{" replicas ready\n"}'
          REMOTE
