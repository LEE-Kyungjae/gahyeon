<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>가현 운영실</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--panel:#141821;--line:#293040;--text:#f5f7fb;--muted:#9ba7bb;--accent:#a78bfa;--good:#54d6a1;--bad:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#241d3c 0,transparent 36%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
    main{max-width:1180px;margin:auto;padding:36px 22px 80px}header{display:flex;gap:20px;align-items:end;justify-content:space-between;margin-bottom:28px}h1{font-size:34px;margin:0}h2{font-size:18px;margin:0 0 16px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}
    .token{display:flex;gap:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 6;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #0004}.wide{grid-column:span 12}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}
    form{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}label{display:grid;gap:5px;color:var(--muted);font-size:12px}input,textarea,select,button{font:inherit;border-radius:10px;border:1px solid var(--line)}input,textarea,select{width:100%;padding:10px 12px;background:#0d1119;color:var(--text)}textarea{min-height:120px;resize:vertical}button{padding:10px 14px;background:var(--accent);color:#100d18;font-weight:800;cursor:pointer}button.secondary{background:#202634;color:var(--text)}button.danger{background:var(--bad);color:#25070d}.result{white-space:pre-wrap;max-height:260px;overflow:auto;margin-top:12px;padding:12px;background:#090c11;border-radius:10px;color:#cbd5e1}.status{min-height:22px;color:var(--good)}
    @media(max-width:800px){.card{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:stretch;flex-direction:column}.token{flex-direction:column}.two{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Gahyeon Operations</div><h1>가현 운영실</h1><div class="muted">지식·기억·인격·자율 작업을 한곳에서 관리합니다.</div></div><div class="token"><input id="token" type="password" placeholder="관리자 토큰"><button id="connect">연결</button></div></header>
  <div id="status" class="status"></div>
  <section class="card wide"><h2>운영 현황</h2><div id="stats" class="stats"></div></section>
  <div class="grid">
    <section class="card"><h2>지식 추가</h2><form id="ingest"><div class="two"><label>서비스<input name="serviceId" value="gahyeon"></label><label>접근 범위<select name="accessScope"><option>SERVICE</option><option>PRIVATE</option><option>PUBLIC</option></select></label></div><label>소유 subject (PRIVATE)<input name="ownerSubjectId" placeholder="zezestudio:UUID"></label><label>제목<input name="title" required></label><label>출처 이름<input name="displayName" required></label><label>본문<textarea name="bodyText" required></textarea></label><button>청크 생성 및 저장</button></form></section>
    <section class="card"><h2>하이브리드 검색</h2><form id="search"><div class="two"><label>서비스<input name="serviceId" value="gahyeon"></label><label>subject<input name="subjectId" placeholder="zezestudio:UUID"></label></div><label>검색어<input name="query" required></label><button>검색</button></form><div id="searchResult" class="result"></div></section>
    <section class="card"><h2>Soul 버전</h2><form id="soul"><div class="two"><label>캐릭터<input name="characterId" value="gahyeon"></label><label>작성 subject<input name="createdBySubjectId" required></label></div><label>Identity / Soul Markdown<textarea name="soulMarkdown" required></textarea></label><button>새 리비전 저장</button></form><div id="soulResult" class="result"></div></section>
    <section class="card"><h2>자율 작업</h2><form id="todo"><div class="two"><label>캐릭터<input name="characterId" value="gahyeon"></label><label>월드<input name="worldId" value="gahyeon-home"></label></div><label>소유 subject<input name="ownerSubjectId"></label><label>작업 설명<textarea name="description" required></textarea></label><button>TODO 추가</button></form><div id="todoResult" class="result"></div></section>
    <section class="card"><h2>계정 기억 병합</h2><form id="merge"><label>Principal ID<input name="principalId" type="number" required></label><label>기존 subject<input name="sourceSubjectId" placeholder="principal:42" required></label><label>대상 subject<input name="targetSubjectId" placeholder="zezestudio:UUID" required></label><button>승인 요청 생성</button></form><form id="mergeApproval" style="margin-top:12px"><label>요청 ID<input name="requestId" required></label><label>사용자 승인 증거<input name="userApprovalProof" type="password" required></label><div class="two"><button>승인 기록</button><button id="executeMerge" type="button" class="secondary">승인된 병합 실행</button></div></form><div id="mergeResult" class="result">병합은 요청 생성 후 별도 사용자 승인 증거가 있어야 실행됩니다.</div></section>
    <section class="card"><h2>개인정보 삭제</h2><form id="remove"><div class="two"><label>Principal ID<input name="principalId" type="number" required></label><label>서비스<input name="serviceId" value="gahyeon"></label></div><label>삭제 subject<input name="subjectId" required></label><button class="danger">PostgreSQL·벡터·캐시 삭제</button></form><div id="removeResult" class="result"></div></section>
  </div>
</main><script>
const token=document.querySelector('#token'),status=document.querySelector('#status');token.value=sessionStorage.getItem('gahyeonAdminToken')||'';
const headers=()=>({'Content-Type':'application/json','X-Gahyeon-Admin-Token':token.value});
async function api(path,options={}){const response=await fetch('./gahyeon'+path,{...options,headers:{...headers(),...(options.headers||{})}});if(!response.ok)throw new Error(`${response.status} ${await response.text()}`);const text=await response.text();return text?JSON.parse(text):null}
function values(form){return Object.fromEntries(new FormData(form).entries())}function show(id,data){document.querySelector(id).textContent=JSON.stringify(data,null,2)}
async function overview(){try{const data=await api('/overview');const labels={knowledgeSources:'지식 출처',knowledgeDocuments:'문서',knowledgeChunks:'청크',memories:'기억',pendingMerges:'병합 대기',pendingTodos:'TODO'};const box=document.querySelector('#stats');box.replaceChildren(...Object.entries(data).map(([key,value])=>{const el=document.createElement('div');el.className='stat';const b=document.createElement('b');b.textContent=value;const s=document.createElement('span');s.textContent=labels[key]||key;el.append(b,s);return el}));status.textContent='연결됨'}catch(error){status.textContent=error.message}}
document.querySelector('#connect').onclick=()=>{sessionStorage.setItem('gahyeonAdminToken',token.value);overview()};
document.querySelector('#ingest').onsubmit=async e=>{e.preventDefault();const body=values(e.target);Object.assign(body,{sourceType:'manual',language:'ko',metadataJson:'{}'});show('#searchResult',await api('/knowledge',{method:'POST',body:JSON.stringify(body)}));overview()};
document.querySelector('#search').onsubmit=async e=>{e.preventDefault();const body=values(e.target);body.limit=10;show('#searchResult',await api('/knowledge/search',{method:'POST',body:JSON.stringify(body)}))};
document.querySelector('#soul').onsubmit=async e=>{e.preventDefault();show('#soulResult',await api('/soul/revisions',{method:'POST',body:JSON.stringify(values(e.target))}));overview()};
document.querySelector('#todo').onsubmit=async e=>{e.preventDefault();show('#todoResult',await api('/todos',{method:'POST',body:JSON.stringify(values(e.target))}));overview()};
document.querySelector('#merge').onsubmit=async e=>{e.preventDefault();const body=values(e.target);body.principalId=Number(body.principalId);show('#mergeResult',await api('/memory/merge-requests',{method:'POST',body:JSON.stringify(body)}));overview()};
document.querySelector('#mergeApproval').onsubmit=async e=>{e.preventDefault();const body=values(e.target);await api(`/memory/merge-requests/${encodeURIComponent(body.requestId)}/approve`,{method:'POST',body:JSON.stringify({userApprovalProof:body.userApprovalProof})});show('#mergeResult',{status:'APPROVED',requestId:body.requestId});overview()};
document.querySelector('#executeMerge').onclick=async()=>{const body=values(document.querySelector('#mergeApproval'));show('#mergeResult',await api(`/memory/merge-requests/${encodeURIComponent(body.requestId)}/execute`,{method:'POST'}));overview()};
document.querySelector('#remove').onsubmit=async e=>{e.preventDefault();if(!confirm('이 subject의 모든 개인 데이터를 삭제할까요?'))return;const body=values(e.target);body.principalId=Number(body.principalId);show('#removeResult',await api('/privacy/delete',{method:'POST',body:JSON.stringify(body)}));overview()};
if(token.value)overview();
</script></body></html>
